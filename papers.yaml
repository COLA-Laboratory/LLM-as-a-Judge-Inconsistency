# Paper list data. Edit here, then run: python generate_paper_list.py
# Fields: title (req), url (req), date "YYYY.MM" (req), category (req),
#         code (opt), tldr (opt). Category must match one in CATEGORY_ORDER
#         inside generate_paper_list.py.
#
# NOTE: entries below are seeds drawn from prior survey work — verify
# links, dates, and venues before publishing.

- title: "A Survey on LLM-as-a-Judge"
  url: "https://arxiv.org/abs/2411.15594"
  date: "2024.11"
  category: "Surveys"
  tldr: "Maps the LLM-as-a-Judge landscape, including a consistency/reliability cluster covering biases and stability."

- title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
  url: "https://arxiv.org/abs/2306.05685"
  date: "2023.06"
  category: "Position / Order Bias"
  code: "https://github.com/lm-sys/FastChat"
  tldr: "Introduces MT-Bench and documents position, verbosity, and self-enhancement biases in LLM judges."

- title: "Length-Controlled AlpacaEval: A Simple Way to Debias Automatic Evaluators"
  url: "https://arxiv.org/abs/2404.04475"
  date: "2024.04"
  category: "Length / Verbosity Bias"
  code: "https://github.com/tatsu-lab/alpaca_eval"
  tldr: "Regresses out answer length to produce a length-controlled win rate, reducing verbosity bias."

- title: "Investigating Non-Transitivity in LLM-as-a-Judge"
  url: "https://arxiv.org/abs/2502.14074"
  date: "2025.02"
  category: "Non-Transitivity"
  tldr: "Shows pairwise LLM judgments violate transitivity; analyzes Bradley-Terry limits and round-robin tournament aggregation."

- title: "RewardBench: Evaluating Reward Models for Language Modeling"
  url: "https://arxiv.org/abs/2403.13787"
  date: "2024.03"
  category: "Calibration & Reliability"
  code: "https://github.com/allenai/reward-bench"
  tldr: "Benchmark probing reward-model / judge reliability across chat, reasoning, and safety prompts."

- title: "Large Language Models are not Fair Evaluators"
  url: "https://arxiv.org/abs/2305.17926"
  date: "2023.05"
  category: "Position / Order Bias"
  tldr: "Swapping the order of two answers changes the reported winner. The authors test balanced presentation orders to reduce this effect."

- title: "LLM Evaluators Recognize and Favor Their Own Generations"
  url: "https://arxiv.org/abs/2404.13076"
  date: "2024.04"
  category: "Self-Preference Bias"
  tldr: "Tests whether judges recognize their own text and finds that stronger self-recognition tracks a stronger preference for their own answers."

- title: "Same Input, Different Scores: A Multi Model Study on the Inconsistency of LLM Judge"
  url: "https://arxiv.org/abs/2603.04417"
  date: "2026.03"
  category: "Stability & Self-Consistency"
  tldr: "Repeats scoring on identical inputs to measure within-judge variation, between-judge differences, and sensitivity to sampling temperature."

- title: "The Coin Flip Judge? Reliability and Bias in LLM-as-a-Judge Evaluation"
  url: "https://arxiv.org/abs/2606.13685"
  date: "2026.06"
  category: "Stability & Self-Consistency"
  tldr: "Compares repeated pairwise verdicts with pointwise score gaps and estimates how many votes recover a reference verdict in the studied sample."

- title: "All Verdicts are Not Equal: Rethinking LLM Judge Reliability"
  url: "https://arxiv.org/abs/2610.12083"
  date: "2026.10"
  category: "Stability & Self-Consistency"
  tldr: "Crosses repeated trials with answer-order swaps and reference labels to distinguish reproducibility, order sensitivity, and correctness."

- title: "JudgeBench: A Benchmark for Evaluating LLM-based Judges"
  url: "https://arxiv.org/abs/2410.12784"
  date: "2024.10"
  category: "Calibration & Reliability"
  tldr: "Tests whether judges identify the correct response in hard pairs spanning knowledge, reasoning, mathematics, and code."

- title: "Aligning with Human Judgement: The Role of Pairwise Preference in Large Language Model Evaluators"
  url: "https://arxiv.org/abs/2403.16950"
  date: "2024.03"
  category: "Mitigation & Repair"
  tldr: "Studies residual disagreement after bias calibration and uses pairwise human preferences to improve evaluator alignment."
