# One work per record. Keep version identifiers on the same record.
- id: skim-gpt
  title: 'SKiM-GPT: combining biomedical literature-based discovery with large language model hypothesis evaluation'
  year: 2026
  publication: BMC Bioinformatics 27, 16 (online 17 December 2025)
  url: https://doi.org/10.1186/s12859-025-06350-7
  doi: 10.1186/s12859-025-06350-7
  code: https://github.com/stewart-lab/skimgpt
  role: A
  tasks:
  - hypothesis quality
  - claim support
  methods:
  - pointwise scoring
  - retrieval-augmented
  contribution: Scores how strongly the retrieved abstracts support a proposed biomedical relationship.
  object: The judge evaluates a proposed disease–gene–drug relationship.
  basis: It reads PubMed titles and abstracts linking the terms, optionally filtered for relevance.
  output: It returns a support score from −2 to +2 and explains its rating.
  location: Implementation, Fig. 1. Results, Score alignment evaluation (Fig. 3), Cost estimation (Table 1), Retrieved
    text vs. memory.
  source: https://link.springer.com/article/10.1186/s12859-025-06350-7
  validation:
    repeat:
      status: reported
      label: 10 runs
      detail: Ten independent runs per hypothesis, with score distributions in Fig. 3.
    expert:
      status: reported
      label: 4 experts
      detail: Four computational biologists scored the same evidence. Without filtering, median directions agreed
        for 13 of 14 hypotheses.
    literature:
      status: reported
      label: Abstract edits
      detail: Real abstracts plus controlled changes to abstract content test sensitivity to the supplied evidence.
    experimental: Not reported
    decision:
      status: reported
      label: Review time
      detail: Table 1 compares review of 159 abstracts (8.42 hours per human versus 0.23 hours for the system).
        Downstream discovery yield was not reported.
  limitation: The selected hypotheses cover 14 relationships. Abstract coverage and publication bias restrict the
    evidence.
  reading: full text checked
  screening: included
  reason: Design and expert comparison of the evidence-based judge are central contributions.
  versions:
  - https://doi.org/10.1101/2025.07.28.664797
  homepage:
    name: SKiM-GPT
    branch: claim support
    object: Disease–gene–drug link
    method: Signed support score
    validation: Same abstracts, four experts
    use: Review a proposed link
    limit: Abstract coverage
- id: knowhd
  title: 'Toward Reliable Scientific Hypothesis Generation: Evaluating Truthfulness and Hallucination in Large Language
    Models'
  year: 2025
  publication: IJCAI 2025, 7849–7857
  url: https://doi.org/10.24963/ijcai.2025/873
  doi: 10.24963/ijcai.2025/873
  arxiv: '2505.14599'
  code: https://github.com/gzxiong/TruthHypo
  role: A
  tasks:
  - claim support
  - hypothesis quality
  methods:
  - retrieval-augmented
  - classification
  contribution: Estimates how much of a hypothesis and its rationale is grounded in earlier knowledge.
  object: The judge evaluates atomic claims extracted from a hypothesis and its reasoning.
  basis: It receives retrieved PubMed passages, knowledge-graph relations, or both.
  output: Each claim receives a binary support decision. Equation 3 averages these decisions across claims.
  location: KnowHD method, Fig. 2 and Eqs. 1–3 (pp. 7851–7852). Open-ended evaluation, Table 4. Extended appendix
    accompanies the arXiv version.
  source: https://ijcai.org/proceedings/2025/0873.pdf
  validation:
    repeat: Not reported
    expert:
      status: reported
      label: 54 pairs
      detail: Two experts compared 54 selected pairs. Expert–expert agreement was 80%. Experts selected the more
        grounded hypothesis as more likely true in 59.26% of pairs.
    literature:
      status: reported
      label: Text or graph
      detail: Binary support against a time-limited corpus or graph, assessed separately from downstream benchmark
        labels.
    experimental: Not reported
    decision:
      status: reported
      label: Offline filter
      detail: Retrospective filtering on benchmark candidates. Prospective laboratory decision benefit was not reported.
  limitation: Retrieval misses count against groundedness. Selection for a large score gap limits extrapolation
    to close pairs. The score does not measure novelty or biological truth.
  reading: full text checked
  screening: included
  reason: KnowHD is a separately specified and evaluated biomedical evidence judge.
  homepage:
    name: KnowHD
    branch: claim support
    object: Claims in a rationale
    method: Atomic entailment
    validation: Earlier evidence, expert choices
    use: Filter hypotheses
    limit: Retrieval misses
- id: chatinvent-judge
  title: Designing an LLM-based evaluation system for agentic AI in drug discovery through human alignment
  year: 2026
  publication: Artificial Intelligence in the Life Sciences 10, 100187
  url: https://doi.org/10.1016/j.ailsci.2026.100187
  doi: 10.1016/j.ailsci.2026.100187
  arxiv: '2608.21057'
  role: A
  tasks:
  - output quality
  methods:
  - pointwise scoring
  - classification
  contribution: Validates a rubric for grading a drug-discovery assistant’s responses against expert ratings.
  object: The judge grades ChatInvent’s answer to a drug-discovery request.
  basis: It sees the request, response, evaluation context and expected, accepted and actual tool calls.
  output: It assigns a rubric label and justification for completeness, relevancy, structural clarity and scope
    adherence. A separate program checks tool-call correctness.
  location: Fig. 1 and Table 2, then §§5.2–5.4 and Table 4 (journal full text).
  source: https://research.chalmers.se/publication/554919/file/554919_Fulltext.pdf
  validation:
    repeat:
      status: reported
      label: 3 runs
      detail: Three runs on 30 unique questions per judge, with agreement by dimension (§5.3).
    expert:
      status: reported
      label: 5 experts
      detail: Five experts provided the reference ratings. After few-shot optimization, exact agreement with the
        human majority rose from 0.80 to 0.86 on ten validation questions.
    literature: Not reported
    experimental: Not reported
    decision: Not reported
  limitation: One assistant. Agreement varies by dimension. Prompt optimization was evaluated on ten validation
    questions. Scores concern the answer delivered to the user.
  reading: full text checked
  screening: included
  reason: The central contribution is judge design and expert alignment in drug discovery.
  code: https://github.com/MolecularAI/langdmta-lab/blob/main/evaluation/langdmta_eval/README.md
  homepage:
    name: ChatInvent judge
    branch: research outputs
    object: Assistant response
    method: Four rubric labels
    validation: Repeats, expert majority
    use: Audit assistant outputs
    limit: One assistant
