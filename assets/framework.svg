<svg xmlns="http://www.w3.org/2000/svg" width="860" height="573" viewBox="0 0 860 573" role="img">
  <title>Three biological judging tasks and their possible research uses</title>
  <rect x="0" y="0" width="860" height="573" fill="#fbfcfa" rx="10" />
  <text x="20" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#506469" text-anchor="start">Object</text>
  <text x="198" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17645f" text-anchor="start">→</text>
  <text x="230" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#506469" text-anchor="start">Evidence or criteria</text>
  <text x="408" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17645f" text-anchor="start">→</text>
  <text x="440" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#506469" text-anchor="start">Judge output</text>
  <text x="618" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17645f" text-anchor="start">→</text>
  <text x="650" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#506469" text-anchor="start">Possible use</text>
  <rect x="10" y="41" width="840" height="34" fill="#dceee8" rx="5" />
  <text x="20" y="64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17645f" text-anchor="start">Literature support for biological relationships</text>
  <text x="20" y="95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17645f" text-anchor="start">SKiM-GPT · BMC Bioinformatics 2026</text>
  <text x="20" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Proposed</text>
  <text x="20" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">disease–gene–drug link</text>
  <text x="230" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Retrieved PubMed</text>
  <text x="230" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">abstracts</text>
  <text x="440" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Support score (−2 to</text>
  <text x="440" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">+2) and rationale</text>
  <text x="650" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Review support for a</text>
  <text x="650" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">proposed link</text>
  <text x="20" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17645f" text-anchor="start">KnowHD · IJCAI 2025</text>
  <text x="20" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Atomic claims in a</text>
  <text x="20" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">hypothesis rationale</text>
  <text x="230" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Retrieved passages</text>
  <text x="230" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">and/or graph relations</text>
  <text x="440" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Fraction of claims</text>
  <text x="440" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">supported</text>
  <text x="650" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Filter hypotheses in a</text>
  <text x="650" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">benchmark</text>
  <rect x="10" y="235" width="840" height="34" fill="#dceee8" rx="5" />
  <text x="20" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17645f" text-anchor="start">Multidimensional quality of biological hypotheses</text>
  <text x="20" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17645f" text-anchor="start">Biomedical Hypothesis Evaluation · COLM 2024</text>
  <text x="20" y="311" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Generated biomedical</text>
  <text x="20" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">hypothesis</text>
  <text x="230" y="311" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Background, novelty,</text>
  <text x="230" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">relevance, significance</text>
  <text x="230" y="349" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">and verifiability</text>
  <text x="440" y="311" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Four scores (0–3) with</text>
  <text x="440" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">explanations</text>
  <text x="650" y="311" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Compare hypothesis</text>
  <text x="650" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">generators</text>
  <rect x="10" y="374" width="840" height="34" fill="#dceee8" rx="5" />
  <text x="20" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17645f" text-anchor="start">Output quality of a drug-discovery assistant</text>
  <text x="20" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17645f" text-anchor="start">ChatInvent judge · Artificial Intelligence in the Life Sciences 2026</text>
  <text x="20" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Drug-research assistant</text>
  <text x="20" y="469" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">response</text>
  <text x="230" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">User request, tool</text>
  <text x="230" y="469" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">context and output</text>
  <text x="230" y="488" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">rubric</text>
  <text x="440" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Four rubric labels with</text>
  <text x="440" y="469" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">justifications</text>
  <text x="650" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Audit assistant</text>
  <text x="650" y="469" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">responses</text>
  <rect x="10" y="513" width="840" height="44" fill="#fffaf0" rx="5" stroke="#78571b" stroke-dasharray="5 4" />
  <text x="20" y="540" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#78571b" text-anchor="start">Planned coverage</text>
  <text x="169" y="540" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#183f42" text-anchor="start">Judging experiment designs and prospectively prioritizing candidates.</text>
</svg>
