<svg xmlns="http://www.w3.org/2000/svg" width="860" height="362" viewBox="0 0 860 362" role="img" aria-labelledby="title desc">
  <title id="title">From a biological research object to a judgment and its use</title>
  <desc>Objects and reference material feed a language-model judge. A verdict can inform review or selection. Expert ratings and held-out evidence can test a verdict independently. Dashed boxes show prospective experimental and decision endpoints outside current coverage.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#52777a"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#153639}
      .label{font-size:13px;font-weight:700;letter-spacing:1px;fill:#49666a}
      .head{font-size:19px;font-weight:700}.body{font-size:15px}
      .box{fill:#fff;stroke:#a8bfbe}.flow{fill:none;stroke:#52777a;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="860" height="362" rx="12" fill="#f6f9f8"/>
  <text x="20" y="29" class="label">INPUTS</text>
  <text x="340" y="29" class="label">JUDGMENT</text>
  <text x="600" y="29" class="label">RESEARCH USE</text>
  <rect x="20" y="43" width="266" height="78" rx="7" class="box"/>
  <text x="35" y="69" class="head">Research object</text>
  <text x="35" y="92" class="body">Hypothesis, supporting claim</text><text x="35" y="111" class="body">or scientific assistant’s answer</text>
  <rect x="20" y="135" width="266" height="78" rx="7" class="box"/>
  <text x="35" y="161" class="head">Reference material</text>
  <text x="35" y="184" class="body">Papers, database relations, task</text><text x="35" y="203" class="body">context or an explicit rubric</text>
  <path d="M286 82H311V126H334" class="flow"/><path d="M286 175H311V126" fill="none" stroke="#52777a" stroke-width="1.8"/>
  <rect x="340" y="62" width="208" height="130" rx="7" fill="#164e50"/>
  <text x="356" y="92" style="fill:white" class="head">LLM judge</text>
  <path d="M356 104H532" stroke="#649391"/>
  <text x="356" y="127" style="fill:white" class="body">Score a dimension,</text>
  <text x="356" y="148" style="fill:white" class="body">compare alternatives or</text>
  <text x="356" y="169" style="fill:white" class="body">rule on evidence support.</text>
  <path d="M548 126H594" class="flow"/>
  <rect x="600" y="62" width="240" height="130" rx="7" class="box"/>
  <text x="616" y="92" class="head">Use the verdict</text>
  <text x="616" y="121" class="body">Review supporting literature,</text>
  <text x="616" y="142" class="body">filter hypotheses offline or</text>
  <text x="616" y="163" class="body">audit generated outputs.</text>
  <path d="M444 193V233" class="flow"/>
  <rect x="20" y="239" width="820" height="100" rx="7" fill="#e7f1ef"/>
  <text x="36" y="267" class="head">Check the judgment independently</text>
  <text x="36" y="292" class="body">Compare with expert ratings or held-out labels.</text>
  <text x="36" y="314" class="body">Repeated calls separately measure stability.</text>
  <rect x="470" y="252" width="351" height="74" rx="5" fill="#fffdf7" stroke="#8b7241" stroke-dasharray="5 4"/>
  <text x="485" y="274" class="label">PROSPECTIVE TEST · COVERAGE GAP</text>
  <text x="485" y="296" class="body">Test the chosen hypothesis in the lab.</text>
  <text x="485" y="315" class="body">Measure how using the verdict changes yield.</text>
</svg>
